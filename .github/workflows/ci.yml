name: CI → Security → Test → Build → Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Run security checks, lint, tests, and build
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: dist
      HTACCESS_PATH: public/.htaccess

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need history for docs-only check

      - name: Check for docs-only changes
        id: docs_check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          # If this is the first commit, run all tests
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "run_tests=true" >> $GITHUB_OUTPUT
          # Check if only docs were changed
          elif git diff --name-only "$BASE_SHA" "${{ github.sha }}" | grep -qvE '\.(md|txt)$|^(MAINTENANCE|AUDIT|LICENSE|\.github/.*\.md)'; then
            echo "run_tests=true" >> $GITHUB_OUTPUT
          else
            echo "run_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.docs_check.outputs.run_tests == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Restore build cache
        if: steps.docs_check.outputs.run_tests == 'true'
        uses: actions/cache@v4
        with:
          path: |
            dist
            node_modules/.vite
            node_modules/.cache
          key: ${{ runner.os }}-build-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**/*') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-build-

      - name: Install dependencies
        if: steps.docs_check.outputs.run_tests == 'true'
        run: npm ci

      - name: Security audit
        if: steps.docs_check.outputs.run_tests == 'true'
        run: npm run security:check

      - name: Run quality checks in parallel
        if: steps.docs_check.outputs.run_tests == 'true'
        run: |
          npm run type-check &
          npm run lint &
          npm run format:check &
          wait

      - name: Run tests
        if: steps.docs_check.outputs.run_tests == 'true'
        run: npm run test

      - name: Build
        if: steps.docs_check.outputs.run_tests == 'true'
        run: npm run build

      - name: Package build into tar.gz (preserves dotfiles)
        if: steps.docs_check.outputs.run_tests == 'true'
        run: |
          set -euo pipefail
          TAR_NAME=site-dist.tar.gz
          tar -C "${BUILD_DIR}" -czf "${TAR_NAME}" .

      - name: Upload build artifact (tarball)
        if: steps.docs_check.outputs.run_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site-dist.tar.gz

  deploy:
    name: Deploy to bouncingleaf.com
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download build artifact (tarball)
        uses: actions/download-artifact@v4
        env:
          NODE_OPTIONS: '--trace-deprecation'
        with:
          name: site-dist
          path: .

      - name: Extract artifact to dist/
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          TAR_NAME=site-dist.tar.gz
          if [ ! -f "${TAR_NAME}" ]; then
            echo "::error::Expected ${TAR_NAME} not found"
            ls -la
            exit 1
          fi
          tar -C dist -xzf "${TAR_NAME}"

      - name: Deploy via rsync over SSH
        env:
          REMOTE_PATH: ${{ secrets.DREAMHOST_BL_REMOTE_PATH }}
          REMOTE_USER: ${{ secrets.DREAMHOST_BL_SSH_USER }}
          REMOTE_HOST: ${{ secrets.DREAMHOST_SSH_HOST }}
          SSH_KEY: ${{ secrets.DREAMHOST_BL_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key

          ssh-keyscan -H "$REMOTE_HOST" >> ~/.ssh/known_hosts

          # Deploy to bouncingleaf.com
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=yes" dist/ "${REMOTE_USER}@${REMOTE_HOST}:${REMOTE_PATH}"

          # Cleanup: remove key and stop agent
          ssh-add -D || true
          rm -f ~/.ssh/deploy_key
          if [ -n "${SSH_AGENT_PID:-}" ]; then
            kill "$SSH_AGENT_PID" || true
          fi
